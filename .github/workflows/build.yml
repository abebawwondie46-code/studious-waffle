name: Build Flutter APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'

      - name: Force recreate android directory with correct structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.kuanyngne --project-name kuanyngne .
          yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK with verbose output
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
