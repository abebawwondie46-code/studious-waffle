name: Build Flutter APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Fix Android Compile SDK Version
        run: |
          echo "android.enableR8.fullMode=false" >> android/gradle.properties
          echo 'subprojects { afterEvaluate { project -> if (project.hasProperty("android")) { project.android { compileSdkVersion 36 } } } }' >> android/build.gradle

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
