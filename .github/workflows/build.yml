name: Build Flutter APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - run: flutter pub get

      - name: Set Android SDK Version to 34
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
