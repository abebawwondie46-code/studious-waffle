name: Build Flutter APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Recreate Android directory safely
        run: |
          rm -rf android
          flutter create --project-name kuanyngne --platforms=android --empty --overwrite .

      - name: Add missing dependencies
        run: |
          flutter pub add file_picker video_player image_picker dio path_provider shared_preferences supabase_flutter share_plus url_launcher

      - name: Configure Android SDK Settings
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.targetSdkVersion=34" >> android/gradle.properties

      - name: Restore original code
        run: git checkout HEAD -- lib/

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
