name: Build Flutter APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Recreate Android directory properly
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          echo "android.enableR8.fullMode=false" >> android/gradle.properties
          echo 'subprojects { afterEvaluate { project -> if (project.hasProperty("android")) { project.android { compileSdkVersion 36 } } } }' >> android/build.gradle

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/**/app-debug.apk
